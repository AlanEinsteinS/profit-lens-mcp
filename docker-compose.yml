services:
  profit-lens:
    build: .
    image: profit-lens-mcp:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MCP_TRANSPORT: http
      HOST: 0.0.0.0
      PORT: 3000
    # Loopback only: publish through a reverse proxy (Traefik, Caddy, nginx) with TLS, not directly.
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
